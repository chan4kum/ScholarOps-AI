[project]
name = "opportunity-intel"
version = "0.1.0"
description = "ScholarOps AI — local-first multi-agent funded PhD copilot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "sqlalchemy>=2.0.36",
  "openai>=1.59.0",
  "httpx>=0.28.0",
  "feedparser>=6.0.11",
  "selectolax>=0.3.27",
  "trafilatura>=2.0.0",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.20",
  "pypdf>=5.1.0",
  "python-docx>=1.1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0",
]
postgres = [
  "psycopg[binary]>=3.2.0",
]
browser = [
  "playwright>=1.49.0",
]
local = [
  # google-genai removed: gemini.py now uses raw httpx REST (no SDK required)
  "langgraph>=0.4.0",
  "faiss-cpu>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
